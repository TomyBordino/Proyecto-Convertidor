name: TPO Perfil 3 - Alertas diarias

# Corre el chequeo de alertas al cierre de BYMA (17:00 ART = 20:00 UTC), de lunes a viernes.
# Si el algoritmo detecta una alerta, abre un Issue en el repo con las órdenes a ejecutar
# (GitHub te avisa por mail / app). Requiere que tpo-perfil3/estado/cartera.json esté commiteado.
on:
  schedule:
    - cron: "15 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alertas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpo-perfil3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tpo.py alertas
      - name: Abrir issue si hay alerta
        if: hashFiles('tpo-perfil3/salidas/alerta_actual.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Alerta TPO $(date +%F)" --body-file salidas/alerta_actual.md
